        - main [ref=f13e548]:
          - generic [ref=f13e550]:
            - heading "Introduction" [level=1] [ref=f13e551]: "Introduction #"
            - paragraph [ref=f13e552]: "True Outliner turns any Obsidian note into an outline: a tree of nodes that can be indented, moved, split, zoomed into and selected as whole units, with every operation working on the tree rather than on lines of text. The file on disk stays plain markdown."
            - generic [ref=f13e553]:
              - paragraph [ref=f13e554]: Early preview
              - paragraph [ref=f13e555]:
                - text: True Outliner is under active development. It is usable today and every feature on this site is real, but the plugin is not yet in Obsidian's community plugin directory, defaults may still change, and a few rough edges are listed under
                - link "known limitations" [ref=f13e556] [cursor=pointer]:
                  - /url: ./../reference/limitations
                - text: . Keep backups of anything irreplaceable, as with any plugin that edits notes.
            - heading "The idea" [level=2] [ref=f13e557]: "The idea #"
            - paragraph [ref=f13e558]:
              - text: "Dedicated outliners such as Workflowy, Roam, Logseq and Tana share one invariant: the document is a"
              - strong [ref=f13e559]: tree of nodes
              - text: ", and every operation respects node boundaries."
            - list [ref=f13e560]:
              - listitem [ref=f13e561]: Typing, selecting, deleting, moving and pasting all stay inside the tree.
              - listitem [ref=f13e562]: The structure cannot be malformed by a careless keystroke.
            - paragraph [ref=f13e563]: Obsidian's markdown lists have no such invariant. Plugins that add outliner keybindings work on flat text, so the structure is only as safe as the caret's position.
            - list [ref=f13e564]:
              - listitem [ref=f13e565]: A Backspace at the wrong column merges two items.
              - listitem [ref=f13e566]: A paste lands half a subtree at the wrong depth.
              - listitem [ref=f13e567]: A drag leaves children orphaned.
            - paragraph [ref=f13e568]: True Outliner brings the enforced-tree invariant to Obsidian without leaving markdown behind.
            - list [ref=f13e569]:
              - listitem [ref=f13e570]:
                - strong [ref=f13e571]: Any note is an outline.
                - text: "Every note already has a block structure: headings, paragraphs, list items, code blocks, tables."
                - list [ref=f13e572]:
                  - listitem [ref=f13e573]: That structure maps losslessly onto a node tree, so nothing has to be converted and no note is "an outliner note".
                  - listitem [ref=f13e574]: The tree view is a way of looking at the notes that already exist.
              - listitem [ref=f13e575]:
                - strong [ref=f13e576]: Editing works on the tree.
                - text: Indent, outdent, move, split, merge, delete and paste all go through the tree.
                - list [ref=f13e577]:
                  - listitem [ref=f13e578]: A node carries its children.
                  - listitem [ref=f13e579]: A selection covers whole nodes.
                  - listitem [ref=f13e580]: An edit that would leave children without a parent, or text outside the tree, is rewritten into the well-formed equivalent or refused with a short cue.
              - listitem [ref=f13e581]:
                - strong [ref=f13e582]: The file stays clean.
                - text: No front matter, IDs or hidden metadata are needed to make the outliner work.
                - list [ref=f13e583]:
                  - listitem [ref=f13e584]: Parsing a note and encoding it back is byte-identical.
                  - listitem [ref=f13e585]: Every structural edit resolves to the smallest diff that expresses it.
                  - listitem [ref=f13e586]: Notes keep working with every other tool, plugin and sync method.
              - listitem [ref=f13e587]:
                - strong [ref=f13e588]: Public APIs only.
                - text: The plugin is built on Obsidian's documented editor and plugin APIs, with no patching of private internals.
            - heading "What it looks like" [level=2] [ref=f13e589]: "What it looks like #"
            - paragraph [ref=f13e590]: In outline mode a note is drawn on a single indentation grid, and the keys work on the tree.
            - list [ref=f13e591]:
              - listitem [ref=f13e592]:
                - strong [ref=f13e593]: The grid.
                - text: Every node kind steps right by the same amount per level.
                - list [ref=f13e594]:
                  - listitem [ref=f13e595]: Guide lines connect each node to its ancestors.
                  - listitem [ref=f13e596]: A small marker in the gutter names each node's kind.
              - listitem [ref=f13e597]:
                - strong [ref=f13e598]: The caret
                - text: only ever sits on content, never on a blank line or a list marker.
              - listitem [ref=f13e599]:
                - strong [ref=f13e600]: The keys
                - text: act on whole nodes.
                - list [ref=f13e601]:
                  - listitem [ref=f13e602]: Tab and Shift+Tab move whole subtrees.
                  - listitem [ref=f13e603]: Enter splits a node into two.
                  - listitem [ref=f13e604]: Shift+Arrow grows a selection one node at a time.
              - listitem [ref=f13e605]:
                - strong [ref=f13e606]: Folding.
                - text: Any node with children folds, and a fold follows the node when it moves.
              - listitem [ref=f13e607]:
                - strong [ref=f13e608]: Zoom.
                - text: A click on a marker zooms into that node.
              - listitem [ref=f13e609]:
                - strong [ref=f13e610]: Backlinks.
                - text: Below the note, every reference to it from elsewhere in the vault is listed in the tree of the note it came from.
            - paragraph [ref=f13e611]: "The quickest way to see it is this site: the docs are written as outlines, and every page can be drawn as one."
            - generic [ref=f13e612]:
              - paragraph [ref=f13e613]: This documentation is its own demo
              - paragraph [ref=f13e614]: "Every page of these docs can be read as an outline, drawn the way the plugin draws a note: one grid, a marker per block, guides, folding, zoom and a backlinks footer."
              - paragraph [ref=f13e615]:
                - button "Back to long-form" [pressed] [ref=f13e616] [cursor=pointer]
                - text: The same switch sits at the bottom right of every page.
              - paragraph [ref=f13e617]: The outline view here is a best-effort rendition in the browser, meant to give the idea. Details differ in Obsidian, where the outline is also editable.
            - paragraph [ref=f13e618]: Switch outline mode off and the note is stock Obsidian again, byte for byte, as the long-form view here is the same page untouched.
            - heading "Where it works" [level=2] [ref=f13e619]: "Where it works #"
            - list [ref=f13e620]:
              - listitem [ref=f13e621]:
                - text: Obsidian
                - strong [ref=f13e622]: 1.5.0 or later
                - text: ", desktop and mobile."
              - listitem [ref=f13e623]:
                - strong [ref=f13e624]: Live Preview and source mode.
                - text: Reading view renders exactly as Obsidian does; there is no outline chrome there.
              - listitem [ref=f13e625]: Every markdown note, in any folder, without any preparation.
            - heading "Reading this guide" [level=2] [ref=f13e626]: "Reading this guide #"
            - paragraph [ref=f13e627]: The guide goes from a first session to one page per feature, with the reference section behind it.
            - list [ref=f13e628]:
              - listitem [ref=f13e629]:
                - link "Getting started" [ref=f13e630] [cursor=pointer]:
                  - /url: ./getting-started
                - text: covers the first five minutes.
              - listitem [ref=f13e631]:
                - link "How a note becomes an outline" [ref=f13e632] [cursor=pointer]:
                  - /url: ./how-notes-become-outlines
                - text: explains the mapping the rest of the plugin is built on.
                - list [ref=f13e633]:
                  - listitem [ref=f13e634]: It is worth reading once, because it answers most "why did it do that?" questions.
              - listitem [ref=f13e635]: The remaining guide pages each take one feature.
              - listitem [ref=f13e636]: The reference section lists every setting, command, key and CSS variable.
