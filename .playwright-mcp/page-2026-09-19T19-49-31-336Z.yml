        - main [ref=f5e467]:
          - generic [ref=f5e469]:
            - heading "Outline mode" [level=1] [ref=f5e470]: "Outline mode #"
            - paragraph [ref=f5e471]: Outline mode is the switch that turns everything else on.
            - list [ref=f5e472]:
              - listitem [ref=f5e473]:
                - strong [ref=f5e474]: "On"
                - text: ": the note is drawn on the outline grid, the keyboard grammar and selection rules apply, zoom is available and the backlinks footer renders."
              - listitem [ref=f5e475]:
                - strong [ref=f5e476]: "Off"
                - text: ": the note is stock Obsidian."
            - figure "One tab, toggled off and on. Only the rendering changes; the note does not." [ref=f5e477]
            - heading "Per tab, not per note" [level=2] [ref=f5e480]: "Per tab, not per note #"
            - paragraph [ref=f5e481]:
              - text: Outline mode is a property of the
              - strong [ref=f5e482]: tab
              - text: ", not of the note or the vault."
            - list [ref=f5e483]:
              - listitem [ref=f5e484]: Two panes showing the same note can be in different modes.
              - listitem [ref=f5e485]:
                - text: Switching a tab to another note resets it to the default.
                - list [ref=f5e486]:
                  - listitem [ref=f5e487]: "There is no per-note memory: a note reopened tomorrow starts from the default like any other."
              - listitem [ref=f5e488]: "The mode survives a round trip through reading view: toggling reading view on and off keeps the tab's outline mode."
              - listitem [ref=f5e489]: Closing the tab forgets it.
            - paragraph [ref=f5e490]: The mode is never written to the note, its front matter or its metadata.
            - heading "The default" [level=2] [ref=f5e491]: "The default #"
            - paragraph [ref=f5e492]:
              - strong [ref=f5e493]: Open new tabs in outline mode
              - text: (on by default) decides how a freshly opened note starts.
            - list [ref=f5e494]:
              - listitem [ref=f5e495]:
                - strong [ref=f5e496]: "On"
                - text: treats every note as an outline.
              - listitem [ref=f5e497]:
                - strong [ref=f5e498]: "Off"
                - text: keeps stock Obsidian by default, and individual tabs are opted in.
            - paragraph [ref=f5e499]: Changing the setting only reaches forward.
            - list [ref=f5e500]:
              - listitem [ref=f5e501]: It affects notes opened from then on, in a new tab or in an existing tab that switches notes.
              - listitem [ref=f5e502]: It never retoggles a tab that is already open, which is how Obsidian's own default view mode setting behaves too.
            - heading "Four ways to toggle" [level=2] [ref=f5e503]: "Four ways to toggle #"
            - paragraph [ref=f5e504]: All four do the same thing to the active tab.
            - table [ref=f5e505]:
              - rowgroup [ref=f5e506]:
                - row [ref=f5e507]:
                  - columnheader "Where" [ref=f5e508]
                  - columnheader "What" [ref=f5e509]
              - rowgroup [ref=f5e510]:
                - row [ref=f5e511]:
                  - cell [ref=f5e512]:
                    - strong [ref=f5e513]: Command palette
                  - cell [ref=f5e514]:
                    - strong [ref=f5e515]: Toggle outline mode
                    - text: . Available whenever a markdown note is active, in any view mode. No default hotkey; assign one under Settings → Hotkeys.
                - row [ref=f5e516]:
                  - cell [ref=f5e517]:
                    - strong [ref=f5e518]: Editor right-click menu
                  - cell [ref=f5e519]:
                    - strong [ref=f5e520]: Enable outline mode
                    - text: or
                    - strong [ref=f5e521]: Disable outline mode
                    - text: ", named for the state of the editor that was right-clicked."
                - row [ref=f5e522]:
                  - cell [ref=f5e523]:
                    - strong [ref=f5e524]: Ribbon
                  - cell [ref=f5e525]:
                    - text: The list-tree icon. Its tooltip is
                    - strong [ref=f5e526]: Toggle outline mode
                    - text: ", and it is highlighted while the active tab is in outline mode. Present on desktop and mobile."
                - row [ref=f5e527]:
                  - cell [ref=f5e528]:
                    - strong [ref=f5e529]: Status bar
                  - cell "A chip on the right of the status bar, click or focus-and-press-Enter to toggle. Desktop only." [ref=f5e530]
            - paragraph [ref=f5e531]: "Toggling shows no notice: the ribbon icon and the status bar chip already say what state the tab is in. When no markdown tab is active both indicators go blank."
            - heading "From reading view" [level=3] [ref=f5e532]: "From reading view #"
            - paragraph [ref=f5e533]: Reading view never draws outline chrome, so a toggle made from it shows differently in each direction.
            - list [ref=f5e534]:
              - listitem [ref=f5e535]:
                - text: Toggling
                - strong [ref=f5e536]: "on"
                - text: also switches the tab into its editing mode (Live Preview or source, whichever the tab was last in), so the outline is visible immediately.
              - listitem [ref=f5e537]:
                - text: Toggling
                - strong [ref=f5e538]: "off"
                - text: changes nothing visible.
            - heading "What the status bar shows" [level=2] [ref=f5e539]: "What the status bar shows #"
            - paragraph [ref=f5e540]:
              - strong [ref=f5e541]: Show outline mode in the status bar
              - text: chooses what the chip shows.
            - list [ref=f5e542]:
              - listitem [ref=f5e543]:
                - strong [ref=f5e544]: An icon
                - text: ", the default."
              - listitem [ref=f5e545]:
                - strong [ref=f5e546]: Words
                - text: ": \"Outline on\" or \"Outline off\"."
              - listitem [ref=f5e547]:
                - strong [ref=f5e548]: Nothing
                - text: .
                - list [ref=f5e549]:
                  - listitem [ref=f5e550]: Obsidian lets the ribbon icon be hidden from the ribbon's own right-click menu but has no equivalent for a plugin's status bar item, so this setting is where the chip is turned off.
            - paragraph [ref=f5e551]: There is no status bar on mobile, so the setting has no effect there.
            - heading "Where outline mode applies" [level=2] [ref=f5e552]: "Where outline mode applies #"
            - list [ref=f5e553]:
              - listitem [ref=f5e554]:
                - strong [ref=f5e555]: Live Preview
                - text: and
                - strong [ref=f5e556]: source mode
                - text: ", in the main editor, in split panes, and in pop-out windows."
              - listitem [ref=f5e557]:
                - text: Not in
                - strong [ref=f5e558]: reading view
                - text: . Reading view renders exactly as stock Obsidian.
              - listitem [ref=f5e559]:
                - text: Not inside the
                - strong [ref=f5e560]: cell editor of a table
                - text: ". The small editor Obsidian opens for a table cell is left alone entirely: no grid, no keys, no zoom."
            - paragraph [ref=f5e561]: Turning outline mode off in a tab that is zoomed in also clears the zoom.
