                  - cell "The parent becomes the zoom root. From a top-level node it clears the zoom." [ref=f9e584]
                - row [ref=f9e585]:
                  - cell [ref=f9e586]:
                    - strong [ref=f9e587]: Zoom out fully
                    - text: (command, or the right-click menu while zoomed)
                  - cell "Back to the whole note." [ref=f9e588]
                - row [ref=f9e589]:
                  - cell "Click the note's name in the trail" [ref=f9e590]
                  - cell "Same as Zoom out fully." [ref=f9e591]
                - row [ref=f9e592]:
                  - cell "Click an ancestor in the trail" [ref=f9e593]
                  - cell "Zoom to that ancestor." [ref=f9e594]
            - paragraph [ref=f9e595]: Zooming out scrolls the node that was just left back into view.
            - heading "When zoom clears itself" [level=2] [ref=f9e596]: "When zoom clears itself #"
            - paragraph [ref=f9e597]: Zoom clears on its own in three situations, so the view never shows something that is no longer true.
            - list [ref=f9e598]:
              - listitem [ref=f9e599]: The zoomed node and its whole subtree are deleted.
              - listitem [ref=f9e600]: A change that did not come from this editor's keyboard, such as an undo, sync from another device, an edit in another pane or in another app, puts content outside the zoomed subtree.
