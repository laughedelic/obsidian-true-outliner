        - main [ref=f9e504]:
          - generic [ref=f9e506]:
            - heading "Zoom" [level=1] [ref=f9e507]: "Zoom #"
            - paragraph [ref=f9e508]: Zoom shows one node and its subtree as if it were the whole note. It is the outliner gesture for "let me focus on this section" or "hoist this item".
            - list [ref=f9e509]:
              - listitem [ref=f9e510]: Everything outside the node disappears from view.
              - listitem [ref=f9e511]: A breadcrumb trail above the content says where the view is.
              - listitem [ref=f9e512]: Editing works exactly as before, confined to what is visible.
              - listitem [ref=f9e513]: "It works on any node: a heading with its section, a list item with its children, a lone paragraph."
            - paragraph [ref=f9e514]: Zoom is a view state, not an edit.
            - list [ref=f9e515]:
              - listitem [ref=f9e516]: It never changes the note.
              - listitem [ref=f9e517]: "It is never saved: closing the tab or switching to another note forgets it."
            - heading "Zooming in" [level=2] [ref=f9e518]: "Zooming in #"
            - table [ref=f9e519]:
              - rowgroup [ref=f9e520]:
                - row [ref=f9e521]:
                  - columnheader "How" [ref=f9e522]
                  - columnheader "Where" [ref=f9e523]
              - rowgroup [ref=f9e524]:
                - row [ref=f9e525]:
                  - cell [ref=f9e526]:
                    - strong [ref=f9e527]: Click the node's marker
                  - cell "The icon in the gutter beside a heading or paragraph, or a list item's bullet or number" [ref=f9e528]
                - row [ref=f9e529]:
                  - cell [ref=f9e530]:
                    - strong [ref=f9e531]: Zoom in to node
                  - cell "Command palette, or the editor's right-click menu" [ref=f9e532]
                - row [ref=f9e533]:
                  - cell "A hotkey" [ref=f9e534]
                  - cell "None is assigned by default; every plausible one is already taken by Obsidian or a common plugin. Assign one under Settings → Hotkeys" [ref=f9e535]
            - paragraph [ref=f9e536]: "A click on a marker only zooms: it does not move the caret, start a selection or fold."
            - list [ref=f9e537]:
              - listitem [ref=f9e538]: Holding a modifier (Mod, Shift, Alt) while clicking leaves the click to Obsidian, so link-following and multi-caret gestures keep working.
              - listitem [ref=f9e539]:
                - text: "Task items are the one exception: their mark is Obsidian's own checkbox, which keeps doing what a checkbox does."
                - list [ref=f9e540]:
                  - listitem [ref=f9e541]: A task is zoomed from the command, the menu or a hotkey.
            - paragraph [ref=f9e542]: The command zooms into the node the caret is in. With a selection covering several nodes, it zooms into the first one.
            - figure "A click on a heading's marker zooms to its section, a click on a bullet zooms to that item, and the commands step back out." [ref=f9e543]
            - heading "While zoomed" [level=2] [ref=f9e546]: "While zoomed #"
            - list [ref=f9e547]:
              - listitem [ref=f9e548]:
                - strong [ref=f9e549]: The trail.
                - text: "Above the content, in the note's own text size: the note's name, then each ancestor of the zoomed node from the outermost inward."
                - list [ref=f9e550]:
                  - listitem [ref=f9e551]:
                    - text: Each crumb shows that ancestor's marker and its text, rendered live, with heading
                    - code [ref=f9e552]: "#"
                    - text: ", quote"
                    - code [ref=f9e553]: ">"
                    - text: and task boxes stripped.
                  - listitem [ref=f9e554]: Clicking an ancestor re-zooms to it.
                  - listitem [ref=f9e555]: Clicking the note's name, or the small marker at the start of the trail, zooms all the way out.
              - listitem [ref=f9e556]:
                - strong [ref=f9e557]: Depth restarts.
                - text: The zoomed node sits at the left edge and its children one level in, with guides drawn from there, so a deeply nested item reads like a top-level one.
              - listitem [ref=f9e558]:
                - strong [ref=f9e559]: Editing is confined.
                - text: The caret, Shift+Arrow, Select All and every structural key stay inside the visible subtree.
                - list [ref=f9e560]:
                  - listitem [ref=f9e561]:
                    - text: A split, move, outdent or paste whose result would fall outside it is refused with
                    - emphasis [ref=f9e562]: That would move it outside the zoomed view
                    - text: .
                  - listitem [ref=f9e563]: Clicking below the last visible line puts the caret on the last visible line, not on hidden text.
              - listitem [ref=f9e564]:
                - strong [ref=f9e565]: The view starts at the top
                - text: ", with the editor focused."
                - list [ref=f9e566]:
                  - listitem [ref=f9e567]: The caret stays where it was if that is still visible, otherwise it lands on the zoomed node.
                  - listitem [ref=f9e568]: A folded subtree is unfolded when it becomes the zoom root; folds elsewhere are left alone.
              - listitem [ref=f9e569]:
                - strong [ref=f9e570]: The backlinks footer
                - text: keeps rendering under the zoomed content.
            - 'figure "Zoomed into Materials: the trail names the note and the heading above, and the section sits at the left edge." [ref=f9e571]':
              - img "The Materials section zoomed in, with the breadcrumb trail above it" [ref=f9e572]
