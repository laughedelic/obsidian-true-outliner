version: 2

# Everything here is a dev dependency, so the usual production/development split
# is empty. The groups follow what breaks together instead: a failing update
# points at one part of the toolchain rather than at a mixed batch.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 6
    labels: [dependencies, area/ci]
    groups:
      # Obsidian's own typings track app releases; an API change wants reading
      # rather than merging, so this one stays on its own.
      obsidian:
        patterns: ["obsidian", "eslint-plugin-obsidianmd"]
      codemirror:
        patterns: ["@codemirror/*"]
      e2e:
        patterns: ["@wdio/*", "webdriverio", "wdio-obsidian-*", "mocha", "@types/mocha"]
      unit-tests:
        patterns: ["vitest", "@vitest/*", "vite", "fast-check"]
      lint-build:
        patterns: ["eslint", "typescript", "typescript-eslint", "esbuild", "builtin-modules"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, area/ci]
    groups:
      actions:
        patterns: ["*"]
