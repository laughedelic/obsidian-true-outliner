# Path to area label, read by `.github/workflows/labeler.yml`. A PR carries one
# label per slice its diff touches; the scope in its title names the primary one.
# `.github/labels.yml` says how a slice earns a label in the first place — the
# repository's own groupings decide, not this file.
#
# A feature area also takes its own e2e specs and helpers, so a fix carrying the
# spec that pins it is labelled for the slice the spec covers as well as the one
# the fix edits. Every feature area is gated on the plugin's own code, though:
# a pull request that touches specs and no `src/`, `styles/` or `manifest.json`
# changes no feature, and is labelled `area/testing` alone. The gate is written
# once, under area/parse, and every other feature area repeats it by alias.

area/parse:
  - changed-files:
      - any-glob-to-any-file:
          - src/parse.ts
          - src/model.ts
          - src/project.ts
          - src/locate.ts
          - src/classify.ts
          - src/line-pos.ts
          - src/node-text.ts
          - src/plugin/parsed-doc.ts
          - src/plugin/source-tree-cache.ts
  - &plugin-code
    changed-files:
      - any-glob-to-any-file:
          - src/**
          - styles/**
          - manifest.json

area/grammar:
  - changed-files:
      - any-glob-to-any-file:
          - src/caret*.ts
          - src/enforce.ts
          - src/rules.ts
          - src/plugin/grammar.ts
          - src/plugin/keymap.ts
          - src/plugin/history-caret.ts
          - src/plugin/provisional-cleanup.ts
          - src/plugin/record-decision.ts
          - src/plugin/nested-editor.ts
          - e2e/specs/3*-*
  - *plugin-code

area/ops:
  - changed-files:
      - any-glob-to-any-file:
          - src/ops.ts
          - src/operand.ts
          - src/escalate.ts
          - src/encode.ts
          - src/reencode.ts
          - src/own-indent.ts
          - src/plugin/dispatch.ts
          - e2e/specs/2*-*
  - *plugin-code

area/selection:
  - changed-files:
      - any-glob-to-any-file:
          - src/select-extend.ts
          - src/select-all-ladder.ts
          - src/plugin/crosscheck.ts
          - src/plugin/transaction-filter.ts
          - e2e/specs/6*-*
  - *plugin-code

# Markers sit here rather than beside this: `marker-shapes.ts` is the icon set,
# and the placement logic lives in `decorations.ts` with the rest of the grid.
area/decorations:
  - changed-files:
      - any-glob-to-any-file:
          - src/plugin/decorate.ts
          - src/plugin/decorations.ts
          - src/plugin/chrome-*.ts
          - src/plugin/appearance.ts
          - src/plugin/guide-hover.ts
          - src/plugin/marker-shapes.ts
          - src/plugin/heading-marker-preview.ts
          - src/lineage.ts
          - styles/**
          - e2e/specs/5*-*
  - *plugin-code

area/folding:
  - changed-files:
      - any-glob-to-any-file:
          - src/plugin/fold-*.ts
          - e2e/folding.ts
          - e2e/specs/9*-*
  - *plugin-code

area/zoom:
  - changed-files:
      - any-glob-to-any-file:
          - src/zoom.ts
          - src/plugin/zoom-*.ts
          - e2e/specs/80-*
  - *plugin-code

area/backlinks:
  - changed-files:
      - any-glob-to-any-file:
          - src/search.ts
          - src/plugin/backlink*.ts
          - src/plugin/footer-*.ts
          - src/plugin/lineage-row.ts
          - e2e/footer.ts
          - e2e/specs/7*-*
  - *plugin-code

area/mode:
  - changed-files:
      - any-glob-to-any-file:
          - src/plugin/outline-state.ts
          - src/plugin/view-registry.ts
          - e2e/specs/1*-*
  - *plugin-code

area/shell:
  - changed-files:
      - any-glob-to-any-file:
          - src/plugin/main.ts
          - src/plugin/messages.ts
          - src/plugin/stats.ts
          - src/plugin/settings.ts
          - src/plugin/settings/**
          - manifest.json
          - e2e/specs/4*-*
  - *plugin-code

# The harness and the infrastructure under it, or a change to tests alone. An
# individual spec or unit test on a change that also edits the plugin belongs to
# the feature it covers, which the globs above already give it: matching `e2e/`
# as a whole would put this label on most changes, since almost every one carries
# the spec that pins it. So the label takes the harness wherever it appears, and
# otherwise a change that touches tests and none of the plugin's own code.
area/testing:
  - changed-files:
      - any-glob-to-any-file:
          - e2e/**
          - tests/**
      - any-glob-to-any-file: &harness
          - e2e/helpers.ts
          - e2e/wdio*.mts
          - e2e/obsidian-target.mts
          - e2e/tsconfig.json
          - e2e/docker/**
          - e2e/fixtures/**
          - e2e/baselines/**
          - scripts/run-e2e.mjs
          - scripts/spec-groups.mjs
          - .github/actions/e2e/**
          - vitest.config.ts
          - codecov.yml
  - changed-files:
      - any-glob-to-any-file: *harness
      - all-globs-to-all-files:
          - "!src/**"
          - "!styles/**"
          - "!manifest.json"

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**
          - .github/labels.yml
          - .github/labeler.yml
          - .github/release.yml
          - .github/dependabot.yml
          - scripts/sync-labels.mjs

area/agents:
  - changed-files:
      - any-glob-to-any-file:
          - AGENTS.md
          - CLAUDE.md
          - .claude/**
          - .agents/**
          - .github/agents/**
          - .github/skills/**
          - openspec/config.yaml
          - scripts/agent-*

# Every file in the change has to match, not just one. A research note landing
# beside the code it justifies is part of that change rather than a documentation
# change, and matching any one file would put this label on most changes for that
# reason. `openspec/**` is here so a proposal-only PR, which the lifecycle opens
# before any code, qualifies on its own.
area/docs:
  - changed-files:
      - any-glob-to-all-files:
          - docs/**
          - openspec/**
          - README.md
          - DEVELOPMENT.md
          - "*.md"

# The website is its own directory and shares no file with the plugin, so it takes
# a label of its own the moment that stack lands.
area/website:
  - changed-files:
      - any-glob-to-any-file:
          - website/**
