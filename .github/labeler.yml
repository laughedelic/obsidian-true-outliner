# Path to area label, read by `.github/workflows/labeler.yml`. A PR carries one
# label per slice its diff touches; the scope in its title names the primary one.
# The globs follow the same slicing as the settings slices and the stylesheet
# parts, so a new feature area is added here at the same time as those.

area/grammar:
  - changed-files:
      - any-glob-to-any-file:
          - src/caret*.ts
          - src/enforce.ts
          - src/rules.ts
          - src/plugin/grammar.ts
          - src/plugin/keymap.ts
          - src/plugin/history-caret.ts
          - src/plugin/provisional-cleanup.ts
          - src/plugin/record-decision.ts
          - e2e/specs/30-*

area/ops:
  - changed-files:
      - any-glob-to-any-file:
          - src/ops.ts
          - src/operand.ts
          - src/escalate.ts
          - src/encode.ts
          - src/reencode.ts
          - src/own-indent.ts
          - src/plugin/dispatch.ts
          - e2e/specs/20-*

area/parse:
  - changed-files:
      - any-glob-to-any-file:
          - src/parse.ts
          - src/model.ts
          - src/project.ts
          - src/locate.ts
          - src/classify.ts
          - src/line-pos.ts
          - src/node-text.ts
          - src/plugin/parsed-doc.ts
          - src/plugin/source-tree-cache.ts

