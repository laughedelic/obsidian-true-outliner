name: Beta

# Testing a pull request on mobile, where there is no vault folder to copy a
# build into. BRAT installs a plugin from a GitHub release, prereleases
# included, so every push to a pull request publishes one, which the phone
# installs by picking its version in BRAT.
#
# Prereleases are invisible to the community-plugin updater and to the Release
# workflow, which fires on `manifest.json` landing on main. The version here is
# computed at build time and never committed, so the two cannot collide.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    # Sweeps betas of pull requests that are no longer open. Weekly: this only
    # reclaims clutter.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# One beta per pull request matters more than every push producing one: a push
# that supersedes another leaves the older build's release unpublished, which is
# what we would have deleted anyway. A pull request closing mid-build cancels
# the build too, before its cleanup runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot's pull requests run with a read-only token, and a fork's
  # branches are not ours to publish from, so both are left out.
  publish:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-slim
    steps:
      # The head commit, not the merge commit a pull request event checks out
      # by default, and all of history, which `git describe` counts through.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci
        shell: bash

      - name: Derive the beta version
        id: version
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node scripts/beta-version.ts "$PR" "$BRANCH" >> "$GITHUB_OUTPUT"

      # Written into the built manifest only. Committing it would move
      # manifest.json, which is what triggers a real release from main.
      - name: Stamp the version into manifest.json
        shell: bash
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json

      - run: npm run build
        shell: bash

      # A version names a commit, so a rebuild of one already published — a
      # reopened pull request, a re-run — has nothing to add.
      - name: Publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, skipping."
            exit 0
          fi
          assets="main.js manifest.json"
          [[ -f styles.css ]] && assets="$assets styles.css"
          gh release create "$version" \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "$version" \
            --notes "Beta build of #$PR (\`$BRANCH\`) at ${HEAD_SHA:0:7}. Install with BRAT; deleted when the pull request closes." \
            $assets

      # Only the newest build of a pull request is worth keeping.
      - name: Drop this pull request's older betas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/beta-cleanup.ts --pr "$PR" --keep "${{ steps.version.outputs.version }}"

  # A merged or closed pull request takes its betas with it, whether or not its
  # branch is deleted. The scheduled sweep covers anything this misses.
  cleanup:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    steps:
      # For a closed pull request, the default branch's scripts: its merge ref
      # may be gone, and its branch may predate them. A sweep runs its own ref's.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Delete the closed pull request's betas
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/beta-cleanup.ts --pr "$PR"

      - name: Delete betas with no open pull request
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/beta-cleanup.ts --orphans
