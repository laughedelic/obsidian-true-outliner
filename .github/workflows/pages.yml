# Builds the website under `website/` with VitePress and publishes it to
# GitHub Pages. A pull request that touches the site gets the build as a check
# without deploying; only `main` deploys. Pages is configured to publish from
# GitHub Actions rather than from a branch, so nothing here commits build output.

name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer one supersedes a queued one. Never cancel a
# deploy that has already started: Pages would be left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
