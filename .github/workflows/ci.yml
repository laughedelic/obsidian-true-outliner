name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs use the latest Obsidian; this pins an older build when chasing a
  # version-specific bug (docs/research/open-questions Q21, Q27). It cannot reach an
  # insider build — this workflow holds no Catalyst credentials.
  workflow_dispatch:
    inputs:
      obsidian-version:
        description: "Obsidian version for the e2e suites (e.g. 1.12.7). Blank = latest public."
        required: false
        default: ""

# A restack force-pushes every layer of a stack within seconds of each other, and
# each push starts the whole matrix — both platforms, every group — for commits
# that no longer exist by the time it finishes. Supersede those. `main` is left
# alone: there each commit's result is the record of that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  node-version: "26"
  # Obsidian instances per e2e job. Beyond the runner's core count this stops
  # paying, and a group can never beat its longest single spec. Note that
  # `waitBudget` in e2e-tests/helpers.ts widens the harness timeouts off this value:
  # changing it needs repeated runs to confirm, not one green one.
  max-instances: "4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run typecheck:scripts

  # The community directory scans every release: the manifest, the license,
  # `npm ci && npm run build`, and its own ESLint and Stylelint rulesets over
  # the source. Obsidian's action runs the same checks here, and `strict` fails
  # the job on anything the directory would rate an error; warnings stay in the
  # job summary.
  directory-scan:
    runs-on: ubuntu-latest
    # It runs a third-party action and the repository's own build scripts.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: obsidianmd/obsidian-workflows@v1
        with:
          scanner-lint: true
          strict: true

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: >-
          npm run test:coverage --
          --reporter=default --reporter=junit
          --outputFile.junit=test-results/unit.junit.xml

      - if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      # Test Analytics: per-test pass/fail history, from which Codecov reports
      # flaky tests. A failing run is the one worth recording, so this runs
      # whatever the tests did, short of a cancellation.
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results/unit.junit.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: false

  # Builds the e2e matrix from the specs that exist rather than a list in YAML.
  # See scripts/spec-groups.ts.
  e2e-groups:
    runs-on: ubuntu-slim
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "groups=$(node scripts/run-e2e.ts --list-groups)" >> "$GITHUB_OUTPUT"

  e2e-desktop:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    name: desktop (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ inputs.obsidian-version || 'latest' }}
          group: ${{ matrix.group }}
          platform: desktop
          max-instances: ${{ env.max-instances }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Same specs under Obsidian's mobile emulation — still the Electron app at a
  # phone viewport, not the Capacitor one. Its own job tree rather than a
  # matrix axis so it can have its own gate: `needs` sees only a matrix job's
  # aggregate result, and mobile is a soft target where desktop is required.
  e2e-mobile:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    name: mobile (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ inputs.obsidian-version || 'latest' }}
          group: ${{ matrix.group }}
          platform: mobile
          max-instances: ${{ env.max-instances }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # A stable check name per platform for branch protection: matrix job names
  # change whenever the groups do.
  e2e-desktop-passed:
    if: always()
    needs: e2e-desktop
    runs-on: ubuntu-slim
    steps:
      - run: '[ "${{ needs.e2e-desktop.result }}" = "success" ]'

  e2e-mobile-passed:
    if: always()
    needs: e2e-mobile
    runs-on: ubuntu-slim
    steps:
      - run: '[ "${{ needs.e2e-mobile.result }}" = "success" ]'
