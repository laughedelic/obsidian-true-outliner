name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs use the latest Obsidian; this pins an older build when chasing a
  # version-specific bug (docs/research/04 Q21, Q27). It cannot reach an
  # insider build — this workflow holds no Catalyst credentials.
  workflow_dispatch:
    inputs:
      obsidian-version:
        description: "Obsidian version for the e2e suites (e.g. 1.12.7). Blank = latest public."
        required: false
        default: ""

env:
  node-version: "26"
  # Obsidian instances per e2e job. Beyond the runner's core count this stops
  # paying, and a group can never beat its longest single spec. Note that
  # `waitBudget` in e2e/helpers.ts widens the harness timeouts off this value:
  # changing it needs repeated runs to confirm, not one green one.
  max-instances: "4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:e2e

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm test

  # Builds the e2e matrix from the specs that exist rather than a list in YAML.
  # See scripts/spec-groups.mjs.
  e2e-groups:
    runs-on: ubuntu-slim
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "groups=$(node scripts/run-e2e.mjs --list-groups)" >> "$GITHUB_OUTPUT"

  e2e-desktop:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    name: desktop (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ inputs.obsidian-version || 'latest' }}
          group: ${{ matrix.group }}
          platform: desktop
          max-instances: ${{ env.max-instances }}

  # Same specs under Obsidian's mobile emulation — still the Electron app at a
  # phone viewport, not the Capacitor one. Its own job tree rather than a
  # matrix axis so it can have its own gate: `needs` sees only a matrix job's
  # aggregate result, and mobile is a soft target where desktop is required.
  e2e-mobile:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    name: mobile (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ inputs.obsidian-version || 'latest' }}
          group: ${{ matrix.group }}
          platform: mobile
          max-instances: ${{ env.max-instances }}

  # A stable check name per platform for branch protection: matrix job names
  # change whenever the groups do.
  e2e-desktop-passed:
    if: always()
    needs: e2e-desktop
    runs-on: ubuntu-slim
    steps:
      - run: '[ "${{ needs.e2e-desktop.result }}" = "success" ]'

  e2e-mobile-passed:
    if: always()
    needs: e2e-mobile
    runs-on: ubuntu-slim
    steps:
      - run: '[ "${{ needs.e2e-mobile.result }}" = "success" ]'
