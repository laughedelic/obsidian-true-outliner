name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Ordinary runs always use the latest Obsidian. This input exists only to
  # pin an OLDER build while chasing a version-specific bug, which this project
  # has lost several rounds to (docs/research/04 Q21, Q27). It cannot reach a
  # beta: every 1.13.x is insider-only (isBeta, no public GitHub asset) and this
  # workflow deliberately holds no Catalyst credentials.
  workflow_dispatch:
    inputs:
      obsidian-version:
        description: "Obsidian version for the e2e suites (e.g. 1.12.7). Blank = latest public."
        required: false
        default: ""

env:
  node-version: "26"
  # How many Obsidian instances each e2e job runs at once.
  #
  # Measured, not picked: the full desktop suite run three times at each of
  # 1/2/3/4 instances gave means of 743s / 407s / 315s / 263s — 1.83x, 2.36x,
  # 2.82x. The curve is already flattening at 4 because the runner has 4 vCPUs,
  # and a group can never finish faster than its longest single spec, so 4 is
  # the ceiling worth taking rather than a number to keep pushing.
  #
  # Raising it again is not free. Contention makes each spec ~1.42x slower
  # (4 / 2.82), which is what broke `waitForNotice` at ~1 run in 16 and is why
  # `waitBudget()` in e2e/helpers.ts scales the harness waits off this value —
  # it is load-bearing for correctness, not only speed. To re-measure, run
  # `E2E_MAX_INSTANCES=N npm run test:e2e` repeatedly; one green run proves
  # nothing, since the failure it needs to catch lives in the tail.
  max-instances: "4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:e2e

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm test

  # The e2e matrix is built from the specs that exist, not from a list pasted
  # into YAML: a new spec file joins a group (and a new decade prefix creates
  # one) with no workflow edit, so the split cannot silently stop covering
  # something. See scripts/spec-groups.mjs.
  e2e-groups:
    # ubuntu-slim: this job only reads file names. It ships Node, which is all
    # `--list-groups` needs, and provisions faster than the full image.
    runs-on: ubuntu-slim
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "groups=$(node scripts/run-e2e.mjs --list-groups)" >> "$GITHUB_OUTPUT"

  e2e-desktop:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    name: desktop (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ inputs.obsidian-version || 'latest' }}
          group: ${{ matrix.group }}
          platform: desktop
          max-instances: ${{ env.max-instances }}

  # Same specs under Obsidian's mobile emulation — still the Electron desktop
  # app at a phone viewport, not the Capacitor app. Kept as its own job tree
  # rather than a dimension of the desktop matrix so that it can have its own
  # gate: the two are not the same promise, desktop being a merge requirement
  # and mobile a soft target.
  e2e-mobile:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
    name: mobile (${{ matrix.group }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ inputs.obsidian-version || 'latest' }}
          group: ${{ matrix.group }}
          platform: mobile
          max-instances: ${{ env.max-instances }}

  # One stable check name per platform. Matrix job names carry their group, so
  # they change whenever the groups do — branch protection needs a name that
  # does not.
  e2e-desktop-passed:
    if: always()
    needs: e2e-desktop
    runs-on: ubuntu-slim
    steps:
      - run: '[ "${{ needs.e2e-desktop.result }}" = "success" ]'

  e2e-mobile-passed:
    if: always()
    needs: e2e-mobile
    runs-on: ubuntu-slim
    steps:
      - run: '[ "${{ needs.e2e-mobile.result }}" = "success" ]'
