name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the e2e suites against a specific Obsidian build on demand. Only works
  # for versions the runner can actually download: every 1.13.x is currently
  # insider-only (isBeta, no public GitHub asset), and this workflow
  # deliberately holds no Catalyst credentials — see the README's "Testing
  # against a beta" note. Once a version goes public, `latest` picks it up on
  # its own and this input is only needed for pinning an OLDER one.
  workflow_dispatch:
    inputs:
      obsidian-version:
        description: "Obsidian version for the e2e suites (e.g. 1.12.7). Blank = latest public."
        required: false
        default: ""

env:
  node-version: "26"
  # How many Obsidian instances each e2e job runs at once. 1 is the behavior
  # every spec was stabilized under; raise it only on evidence from
  # .github/workflows/e2e-parallelism-probe.yml, which measures whether the
  # contention makes timing-sensitive specs flaky.
  max-instances: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:e2e

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm ci
      - run: npm test

  # The e2e matrix is built from the specs that exist, not from a list pasted
  # into YAML: a new spec file joins a group (and a new decade prefix creates
  # one) with no workflow edit, so the split cannot silently stop covering
  # something. See scripts/spec-groups.mjs.
  e2e-groups:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "groups=$(node scripts/run-e2e.mjs --list-groups)" >> "$GITHUB_OUTPUT"

  e2e-desktop:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
        # Add versions here to test more than one — the cache key and the job
        # name both key off this, so entries never clobber each other. Only
        # publicly-downloadable versions work; see the workflow_dispatch note.
        obsidian: ["${{ inputs.obsidian-version || 'latest' }}"]
    name: desktop (${{ matrix.group }}, ${{ matrix.obsidian }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          # matrix.obsidian, NOT inputs.obsidian-version: the matrix value is
          # what names the job and keys the cache, so passing the raw input
          # would make every expanded entry run the same version under different
          # names and caches. The single default entry already resolves to the
          # input (or 'latest').
          obsidian-version: ${{ matrix.obsidian }}
          group: ${{ matrix.group }}
          platform: desktop
          max-instances: ${{ env.max-instances }}

  # Same specs under Obsidian's mobile emulation (still Electron; see the
  # README's "Mobile testing" section). Kept as its own job tree rather than a
  # dimension of the desktop matrix because the two are not the same promise:
  # desktop is a merge requirement, mobile is a soft target.
  e2e-mobile:
    needs: e2e-groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.e2e-groups.outputs.groups) }}
        obsidian: ["${{ inputs.obsidian-version || 'latest' }}"]
    name: mobile (${{ matrix.group }}, ${{ matrix.obsidian }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: ${{ matrix.obsidian }}
          group: ${{ matrix.group }}
          platform: mobile
          max-instances: ${{ env.max-instances }}

  # One stable check name per platform. Matrix job names carry the group and the
  # Obsidian version, so they change whenever either does — branch protection
  # needs something that does not.
  e2e-desktop-passed:
    if: always()
    needs: e2e-desktop
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.e2e-desktop.result }}" = "success" ]'

  e2e-mobile-passed:
    if: always()
    needs: e2e-mobile
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.e2e-mobile.result }}" = "success" ]'
