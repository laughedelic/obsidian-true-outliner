name: Landed

# The gate on merging a pull request. The maintainer enables auto-merge to approve one; this job
# then checks that it has landed on its branch (its OpenSpec change archived with the delta specs
# synced, the version above `main`'s) and, when it has, deploys to the `landing-zone` environment.
# The `Protect main` ruleset requires a successful deployment there, and `Landed` itself is not a
# required check: a required check passes when its job is skipped, while a job skipped by the `if`
# below creates no deployment, so a pull request without auto-merge has nothing to satisfy the
# requirement and cannot merge. A draft cannot enable auto-merge, so the same `if` covers drafts.
#
# `scripts/check-landed.ts` says what each rule reads. It is given the tip of `main` as it is when
# the job runs, and not the event's `base.sha`, which is the base when the event was generated.
#
# Its own workflow rather than a job in CI, because it has to run on events CI ignores:
# `auto_merge_enabled` starts the check and `edited` carries a new title, which is where the kind
# comes from. Adding those to CI would start the whole e2e matrix on every retitle.
#
# The `auto_merge` field is read from the event, which is a snapshot: a push generated just before
# the approval can skip and cancel the run the approval started. The pull request is then blocked,
# not merged, and the next push or a re-run clears it.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, auto_merge_enabled]

permissions:
  contents: read

# A push supersedes whatever an older run would say.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  landed:
    if: ${{ github.event.pull_request.auto_merge != null }}
    runs-on: ubuntu-slim
    environment: landing-zone
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Pinned so that a CLI release changing what `validate` reports shows up
      # as a diff here rather than as a red check on an unrelated pull request.
      - run: npm install -g @fission-ai/openspec@1.13.1

      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --no-tags origin main
          node scripts/check-landed.ts "$(git rev-parse origin/main)" "$TITLE"
