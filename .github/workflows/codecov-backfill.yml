name: Codecov backfill

# One-off: uploads e2e test results rebuilt from the logs of CI runs that
# predate the JUnit upload (`scripts/codecov-backfill.mjs`). Runs on a push to
# its own branch so it can be tried before merging; removed once it has run.

on:
  push:
    branches: [chore/codecov-test-analytics]
    paths:
      - .github/workflows/codecov-backfill.yml
      - scripts/codecov-backfill.mjs

env:
  # "true" rebuilds and prints a sample without uploading.
  DRY_RUN: "false"
  # How many CI runs to read, newest first; blank for every run in the window.
  LIMIT: ""
  # Only runs older than this one; blank for no bound.
  BEFORE: "36179916444"

permissions:
  actions: read
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - run: node scripts/codecov-backfill.mjs collect backfill ${LIMIT:+--limit "$LIMIT"} ${BEFORE:+--before "$BEFORE"}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          echo "job results: $(wc -l < backfill/manifest.tsv)"
          cut -f4 backfill/manifest.tsv | sort | uniq -c
          files=$(cut -f8 backfill/manifest.tsv)
          echo "testcases: $(cat $files | grep -c '<testcase')"
          echo "failures:  $(cat $files | grep -c '<failure')"
          echo "skipped:   $(cat $files | grep -c '<skipped')"
          echo "--- manifest (first 5)"
          head -5 backfill/manifest.tsv
          echo "--- a failing job's JUnit, if any"
          sample=$(grep -l '<failure' $files | head -1 || true)
          head -40 "${sample:-$(echo "$files" | head -1)}"

      - uses: actions/upload-artifact@v7
        with:
          name: codecov-backfill
          path: backfill/
          retention-days: 7

      - if: env.DRY_RUN != 'true'
        run: pip install codecov-cli==11.3.1

      - if: env.DRY_RUN != 'true'
        run: node scripts/codecov-backfill.mjs upload backfill
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
