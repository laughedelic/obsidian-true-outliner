name: PR labels

# Every label a PR carries is derived, so nothing depends on remembering to add
# one: the areas come from the paths the diff touches, and the kind comes from
# the conventional-commit prefix already in the title — which is also the squash
# commit's subject, so the two cannot disagree.
#
# `pull_request_target` runs the workflow from the base branch with a token that
# can write labels. It checks nothing out: both steps read the API alone, so a
# PR cannot reach this workflow's permissions through its own contents. It needs
# no `issues: write` either — the Labels workflow has already created every label
# this one can apply, with its colour and description.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Kind from the title's prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # The whole conventional-commit prefix, so that a title merely starting
          # with one of these words is not read as carrying it. A title with no
          # prefix names no kind, and the release notes file it under Other, which
          # reads as the reminder it is. `scripts/check-landed.ts` reads the
          # title the same way to decide whether a release is owed.
          kind=""
          if [[ "$TITLE" =~ ^([a-z]+)(\([^\)]*\))?!?:[[:space:]] ]]; then
            case "${BASH_REMATCH[1]}" in
              feat) kind=kind/feature ;;
              fix) kind=kind/bug ;;
              chore|docs|refactor|test|ci|perf|style|build|deps|revert) kind=kind/chore ;;
            esac
          fi

          # Every kind label the title does not name comes off, including all of
          # them where it names none: a title edited from one prefix to something
          # unrecognised would otherwise keep the label the old one gave it. Only
          # labels the pull request actually carries are removed, so nothing here
          # needs its failure ignored.
          gh api "repos/$REPO/issues/$NUMBER/labels" --paginate --jq '.[].name' |
            while IFS= read -r have; do
              case "$have" in
                kind/*) [ "$have" = "$kind" ] || gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/$have" >/dev/null ;;
              esac
            done

          if [ -n "$kind" ]; then
            gh api -X POST "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$kind" >/dev/null
          fi
          echo "${kind:-no recognised prefix in: $TITLE}"
