name: e2e parallelism probe

# Measures what raising E2E_MAX_INSTANCES actually buys, and what it costs in
# stability, instead of guessing at either.
#
# Each job runs the FULL desktop suite at one instance count; every count is
# repeated N times because a single green run says nothing about flakiness — the
# question is whether the same suite passes repeatedly under contention.
# `fail-fast: false` keeps the remaining legs measuring after one of them fails,
# and a failure stays a failure: this run's whole purpose is to surface them.
#
# Read the results two ways: the run's Summary tab collects one timing row per
# job, and any job that failed has its failure screenshots attached as an
# artifact. A count that fails intermittently is disqualified no matter how fast
# it is — CI that lies is worse than CI that is slow.
#
# This workflow is a measuring instrument, not part of the merge gate. What it
# has said so far, on ubuntu-latest (4 vCPU), full desktop suite unless noted:
#
#   x1  747s 766s 715s                                    mean 743s
#   x2  389s 407s 425s                                    mean 407s  1.83x
#   x3  325s 310s 310s                                    mean 315s  2.36x
#   x4  261s 275s 254s                                    mean 263s  2.82x
#   x4  213s 212s 225s 220s 212s 224s 209s 234s  (decorations group only)
#
# Twenty runs, no failure. Re-run it after a runner-image change, or when a new
# spec makes a group's shape meaningfully different.

on:
  # TEMPORARY, remove before merge. `workflow_dispatch` only exists once a
  # workflow is on the default branch, so while this lives on a PR branch a
  # push scoped to this file is the only way to start a measurement round.
  push:
    branches: [claude/e2e-test-parallelization-c9b457]
    paths: ['.github/workflows/e2e-parallelism-probe.yml']

  workflow_dispatch:
    inputs:
      instances:
        description: "Instance counts to compare, comma-separated."
        required: false
        default: "1,2,3,4"
      repeats:
        description: "How many times to run each count."
        required: false
        default: "3"
      platform:
        description: "Which suite to probe."
        required: false
        default: desktop
        type: choice
        options: [desktop, mobile]
      group:
        description: "Spec group to probe. Blank = the whole suite."
        required: false
        default: ""

env:
  node-version: "26"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.plan.outputs.instances }}
      repeats: ${{ steps.plan.outputs.repeats }}
    steps:
      - id: plan
        run: |
          instances=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",").map(s=>s.trim()).filter(Boolean)))' "$INSTANCES")
          repeats=$(node -e 'console.log(JSON.stringify(Array.from({length: Number(process.argv[1])}, (_, i) => i + 1)))' "$REPEATS")
          echo "instances=$instances" >> "$GITHUB_OUTPUT"
          echo "repeats=$repeats" >> "$GITHUB_OUTPUT"
        env:
          INSTANCES: ${{ inputs.instances || '4' }}
          REPEATS: ${{ inputs.repeats || '16' }}

  probe:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false is what keeps the other legs running when one fails.
      # `continue-on-error` was also here and was actively harmful: it reports a
      # failed leg as successful, so a probe measuring STABILITY could come back
      # green with runs that had failed inside it.
      fail-fast: false
      matrix:
        instances: ${{ fromJSON(needs.plan.outputs.instances) }}
        repeat: ${{ fromJSON(needs.plan.outputs.repeats) }}
    name: ${{ inputs.platform || 'mobile' }} x${{ matrix.instances }} (#${{ matrix.repeat }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: latest
          group: ${{ inputs.group || 'decorations' }}
          platform: ${{ inputs.platform || 'mobile' }}
          max-instances: ${{ matrix.instances }}
          artifact-suffix: -run${{ matrix.repeat }}
