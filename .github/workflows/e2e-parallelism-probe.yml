name: e2e parallelism probe

# Measures what raising E2E_MAX_INSTANCES actually buys, and what it costs in
# stability, instead of guessing at either.
#
# Each job runs one suite (whole, or a single group) at one instance count, and
# every count is repeated N times, because a single green run says nothing about
# flakiness — the question is whether the same specs pass REPEATEDLY under
# contention. `fail-fast: false` keeps the remaining legs measuring after one of
# them fails, and a failure stays a failure: surfacing them is the entire point,
# so nothing here is allowed to report a failed leg as successful.
#
# Read the results two ways: each job's Summary carries its timing row, and any
# job that failed attaches its failure screenshots as an artifact. A count that
# fails intermittently is disqualified no matter how fast it is — CI that lies
# is worse than CI that is slow.
#
# This workflow is a measuring instrument, not part of the merge gate. What it
# has said so far, on ubuntu-latest (4 vCPU):
#
#   full desktop suite
#     x1  747s 766s 715s      mean 743s
#     x2  389s 407s 425s      mean 407s  1.83x
#     x3  325s 310s 310s      mean 315s  2.36x
#     x4  261s 275s 254s      mean 263s  2.82x
#
# Four is the ceiling worth taking: the curve is flattening against 4 vCPUs, and
# a group can never finish faster than its longest single spec.
#
# It also earned its keep by catching what 20 clean runs had not. At x4, the
# decorations group failed roughly 1 run in 16 on `waitForNotice` — every wait
# budget in helpers.ts had been sized against a SEQUENTIAL run, and x4 makes
# each spec ~1.42x slower (4 / 2.82), with flakes living in the tail rather than
# the mean. `waitBudget()` now scales them. Since that fix, 32 consecutive clean
# runs of the group that flaked; at the observed rate a streak that long happens
# by chance about 19% of the time, so it is good evidence and not proof.
#
# Re-run after a runner-image change, when a new spec meaningfully changes a
# group's shape, or before raising E2E_MAX_INSTANCES again.

on:
  workflow_dispatch:
    inputs:
      instances:
        description: "Instance counts to compare, comma-separated."
        required: false
        default: "1,2,3,4"
      repeats:
        description: "How many times to run each count."
        required: false
        default: "3"
      platform:
        description: "Which suite to probe."
        required: false
        default: desktop
        type: choice
        options: [desktop, mobile]
      group:
        description: "Spec group to probe. Blank = the whole suite."
        required: false
        default: ""

env:
  node-version: "26"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.plan.outputs.instances }}
      repeats: ${{ steps.plan.outputs.repeats }}
    steps:
      - id: plan
        run: |
          instances=$(node -e 'console.log(JSON.stringify(process.argv[1].split(",").map(s=>s.trim()).filter(Boolean)))' "$INSTANCES")
          repeats=$(node -e 'console.log(JSON.stringify(Array.from({length: Number(process.argv[1])}, (_, i) => i + 1)))' "$REPEATS")
          echo "instances=$instances" >> "$GITHUB_OUTPUT"
          echo "repeats=$repeats" >> "$GITHUB_OUTPUT"
        env:
          INSTANCES: ${{ inputs.instances }}
          REPEATS: ${{ inputs.repeats }}

  probe:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false is what keeps the other legs running when one fails.
      # `continue-on-error` was also here and was actively harmful: it reports a
      # failed leg as successful, so a probe measuring STABILITY could come back
      # green with runs that had failed inside it.
      fail-fast: false
      matrix:
        instances: ${{ fromJSON(needs.plan.outputs.instances) }}
        repeat: ${{ fromJSON(needs.plan.outputs.repeats) }}
    name: ${{ inputs.platform }} x${{ matrix.instances }} (#${{ matrix.repeat }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          node-version: ${{ env.node-version }}
          obsidian-version: latest
          group: ${{ inputs.group }}
          platform: ${{ inputs.platform }}
          max-instances: ${{ matrix.instances }}
          artifact-suffix: -run${{ matrix.repeat }}
